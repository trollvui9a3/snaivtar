<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>bấm zô đi eiu</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
}
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat&display=swap" rel="stylesheet">
/* nền */
.bg {
  position: fixed;
  inset: 0;
  background: url("bg.jpg") center/cover no-repeat;
  filter: blur(6px) brightness(0.8);
  z-index: 0;
}

/* mèo */
.cat {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: clamp(180px, 45vw, 320px);
  cursor: pointer;
  z-index: 10;
  transition: 0.5s;
}

/* thư */
.letter {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  width: clamp(260px, 85vw, 600px);
  height: clamp(180px, 50vh, 500px);
  background: url("thu.png") center/cover no-repeat;
  border-radius: 20px;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);

  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;

  padding: 20px;
  font-family: 'Patrick Hand', cursive;
  font-size: clamp(14px, 4vw, 20px);

  z-index: 20;
  transition: 0.4s;
}

.letter.show {
  transform: translate(-50%, -50%) scale(1);
}

/* hoa chung */
.sakura {
  position: fixed;
  width: 10px;
  height: 10px;
  background: pink;
  border-radius: 50%;
  pointer-events: none;
  z-index: 5;
}

/* hoa rơi nhẹ */
.fall {
  animation: fall linear forwards;
}

@keyframes fall {
  from {
    transform: translateY(-20px) rotate(0);
    opacity: 1;
  }
  to {
    transform: translateY(110vh) rotate(360deg);
    opacity: 0;
  }
}

/* hoa bung từ mèo */
.burst {
  animation: burst 1s ease forwards;
}

@keyframes burst {
  from {
    transform: translate(0,0);
    opacity: 1;
  }
  to {
    transform: translate(var(--x), var(--y));
    opacity: 0;
  }
  .bubble {
  position: fixed;

  background: white;
  padding: 10px 15px;
  border-radius: 20px;

  font-family: 'Patrick Hand', cursive;
  font-size: 16px;

  box-shadow: 0 5px 15px rgba(0,0,0,0.2);

  opacity: 0;
  transform: translateY(-10px);
  transition: 0.3s;

  z-index: 15;
}

.bubble.show {
  opacity: 1;
  transform: translateY(0);
}

/* đuôi manga */
.bubble::after {
  content: "";
  position: absolute;
  bottom: -12px;
  left: 50%;
  transform: translateX(-50%);

  border-width: 12px;
  border-style: solid;
  border-color: white transparent transparent transparent;
  }
}
</style>
</head>

<body>

<div class="bg"></div>

<img src="cat.png" class="cat" id="cat">
  <div class="bubble" id="bubble">
  Bấm tui đi 😳
  </div>

<div class="letter" id="letter">
  Chúc eiu sinh nhật vv nhé:>.Năm nay a ko thể tặng quà cho iu đc rồi:<<. tuổi mới iu phải bt giữ gìn sức khỏe nhe, chúc iu mãi mãi xinh đẹp:>.I love you 😘
</div>
<audio id="music" src="nhac.mp3"></audio>
<script>
let count = 0;
const bubble = document.getElementById("bubble");
const cat = document.getElementById("cat");
const letter = document.getElementById("letter");
const music = document.getElementById("music");
function updateBubble() {
  let rect = cat.getBoundingClientRect();
  window.onload = () => {
  updateBubble();
  bubble.classList.add("show");
};
  updateBubble();

if (count === 1) bubble.innerText = "Ê nhẹ thôi 😠";
if (count === 3) bubble.innerText = "Nữa đi nữa đi 😏";
if (count === 5) bubble.innerText = "Mở quà nè 💌";
  bubble.style.top = (rect.top - 70) + "px";
  bubble.style.left = (rect.left + rect.width/2 - 60) + "px";
  }
// 🌸 1. HOA RƠI FULL TIME (NHẸ)
setInterval(() => {
  let sakura = document.createElement("div");
  sakura.className = "sakura fall";

  sakura.style.left = Math.random() * window.innerWidth + "px";
  sakura.style.animationDuration = (6 + Math.random() * 5) + "s";

  document.body.appendChild(sakura);

  setTimeout(() => sakura.remove(), 7000);
}, 400);


// 🐱 2. CLICK MÈO
cat.addEventListener("click", () => {
  count++;
 

  // hiệu ứng nhấn
  cat.style.transform = "translate(-50%, -50%) scale(0.9)";
  setTimeout(() => {
    cat.style.transform = "translate(-50%, -50%) scale(1)";
  }, 100);

  let rect = cat.getBoundingClientRect(); 

    music.play(); // 🎵 phát nhạc




  // 🌸 hoa bung từ mèo
  for (let i = 0; i < 20; i++) {
    let sakura = document.createElement("div");
    sakura.className = "sakura burst";

    sakura.style.left = rect.left + rect.width/2 + "px";
    sakura.style.top = rect.top + rect.height/2 + "px";

    let x = (Math.random() - 0.5) * 300;
    let y = (Math.random() - 0.5) * 300;

    sakura.style.setProperty("--x", x + "px");
    sakura.style.setProperty("--y", y + "px");

    document.body.appendChild(sakura);

    setTimeout(() => sakura.remove(), 1000);
  }

  // 💌 hiện thư
  if (count >= 5) {
    letter.classList.add("show");
  }
});
</script>

</body>
</html>
