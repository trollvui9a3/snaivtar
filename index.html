<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>bấm zô đi eiu</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
}

/* nền */
.bg {
  position: fixed;
  inset: 0;
  background: url("bg.jpg") center/cover no-repeat;
  filter: blur(5px);
  pointer-events: none; /* 🔥 quan trọng */
}

/* mèo */
.cat {
  position: fixed;
  top: 60%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 220px;
  z-index: 10;
  cursor: pointer;
}

/* thư */
.letter {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);

  width: 300px;
  height: 200px;
  background: white;

  display: flex;
  align-items: center;
  justify-content: center;

  opacity: 0;
  transition: 0.3s;
  z-index: 20;
}

.letter.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* hoa */
.sakura {
  position: fixed;
  width: 10px;
  height: 10px;
  background: pink;
  border-radius: 50%;
  pointer-events: none;
}

/* hoa bung */
.burst {
  animation: burst 0.8s forwards;
}

@keyframes burst {
  to {
    transform: translate(var(--x), var(--y));
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="bg"></div>

<img src="cat.png" id="cat" class="cat">

<div id="letter" class="letter">
  💖 Chúc mừng sinh nhật 💖
</div>

<script>
let count = 0;

const cat = document.getElementById("cat");
const letter = document.getElementById("letter");

/* CLICK HANDLER */
function handleTap(e) {
  e.preventDefault(); // 🔥 fix mobile

  count++;

  // mèo co lại
  cat.style.transform = "translate(-50%, -50%) scale(0.9)";
  setTimeout(() => {
    cat.style.transform = "translate(-50%, -50%) scale(1)";
  }, 100);

  // lấy vị trí mèo
  let rect = cat.getBoundingClientRect();

  // hoa bung
  for (let i = 0; i < 10; i++) {
    let s = document.createElement("div");
    s.className = "sakura burst";

    s.style.left = rect.left + rect.width/2 + "px";
    s.style.top = rect.top + rect.height/2 + "px";

    s.style.setProperty("--x", (Math.random()-0.5)*200 + "px");
    s.style.setProperty("--y", (Math.random()-0.5)*200 + "px");

    document.body.appendChild(s);
    setTimeout(() => s.remove(), 800);
  }

  // hiện thư
  if (count >= 5) {
    letter.classList.add("show");
  }
}

/* 🔥 MOBILE + PC */
cat.addEventListener("touchstart", handleTap, { passive: false });
cat.addEventListener("click", handleTap);

</script>

</body>
</html>
