<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
}

/* nền */
.bg {
  position: fixed;
  inset: 0;
  background: url("bg.jpg") center/cover no-repeat;
  filter: blur(6px) brightness(0.8);
  z-index: 0;
  pointer-events: none;
}

/* container fix mobile */
.container {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* mèo */
.cat {
  width: clamp(140px, 35vw, 220px);
  cursor: pointer;
  z-index: 10;
  transition: transform 0.2s ease;
}

/* bubble (fix mobile chuẩn) */
.bubble {
  position: absolute;
  top: -60px;
  left: 50%;
  transform: translateX(-50%);
  
  background: white;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 14px;

  white-space: nowrap;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.bubble::after {
  content: "";
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  border: 10px solid transparent;
  border-top-color: white;
}

/* thư */
.letter {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  width: clamp(260px, 80vw, 400px);
  height: clamp(180px, 40vh, 250px);
  background: url("thu.png") center/cover no-repeat;
  border-radius: 20px;

  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;

  padding: 20px;
  font-size: clamp(14px, 3.5vw, 18px);

  z-index: 20;
  transition: 0.4s;
}

.letter.show {
  transform: translate(-50%, -50%) scale(1);
}

/* hoa */
.sakura {
  position: fixed;
  width: 10px;
  height: 10px;
  background: pink;
  border-radius: 50%;
  pointer-events: none;
  z-index: 5;
}

/* hoa rơi */
.fall {
  animation: fall linear forwards;
}

@keyframes fall {
  from {
    transform: translateY(-20px);
  }
  to {
    transform: translateY(110vh);
    opacity: 0;
  }
}

/* hoa bung */
.burst {
  animation: burst 0.8s ease forwards;
}

@keyframes burst {
  to {
    transform: translate(var(--x), var(--y));
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- 🆕 container fix mobile -->
<div class="container">
  <div style="position: relative;">
    <img src="cat.png" class="cat" id="cat">
    <div class="bubble" id="bubble">Bấm tui đi 😳</div>
  </div>
</div>

<div class="letter" id="letter">
  Chúc eiu sinh nhật vv nhé:>.Năm nay a ko thể tặng quà cho iu đc rồi:<<. tuổi mới iu phải bt giữ gìn sức khỏe nhe, chúc iu mãi mãi xinh đẹp:>.I love you 😘
</div>

<audio id="music" src="nhac.mp3"></audio>

<script>
let count = 0;
const cat = document.getElementById("cat");
const letter = document.getElementById("letter");
const music = document.getElementById("music");
const bubble = document.getElementById("bubble");

/* hoa rơi */
setInterval(() => {
  let sakura = document.createElement("div");
  sakura.className = "sakura fall";

  sakura.style.left = Math.random() * window.innerWidth + "px";
  sakura.style.animationDuration = (5 + Math.random() * 3) + "s";

  document.body.appendChild(sakura);
  setTimeout(() => sakura.remove(), 6000);
}, 400);

/* click mèo */
cat.addEventListener("click", () => {
  count++;

  cat.style.transform = "scale(0.9)";
  setTimeout(() => {
    cat.style.transform = "scale(1)";
  }, 120);

  /* đổi text bubble */
  if (count === 1) bubble.innerText = "bấm zô bé để mở nek";
  if (count === 3) bubble.innerText = "dex chào chj dâu nhé";
  if (count === 5) bubble.innerText = "Hoàn Huy xin giửi vk";

  let rect = cat.getBoundingClientRect();

  /* hoa bung */
  for (let i = 0; i < 12; i++) {
    let sakura = document.createElement("div");
    sakura.className = "sakura burst";

    sakura.style.left = rect.left + rect.width/2 + "px";
    sakura.style.top = rect.top + rect.height/2 + "px";

    let x = (Math.random() - 0.5) * 140;
    let y = (Math.random() - 0.5) * 140;

    sakura.style.setProperty("--x", x + "px");
    sakura.style.setProperty("--y", y + "px");

    document.body.appendChild(sakura);
    setTimeout(() => sakura.remove(), 800);
  }

  music.play().catch(()=>{});

  if (count >= 5) {
    letter.classList.add("show");
  }
});
</script>

</body>
</html>
