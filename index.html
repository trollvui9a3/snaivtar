<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>bấm zô đi eiu</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
}

/* nền */
.bg {
  position: fixed;
  inset: 0;
  background: url("bg.jpg") center/cover no-repeat;
  filter: blur(6px) brightness(0.8);
  z-index: 0;
}

/* mèo */
.cat {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 250px;
  cursor: pointer;
  z-index: 10;
  transition: 0.5s;
}

/* thư */
.letter {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  width: 600px;
  height: 500px;
  background: url("thu.png") center/cover no-repeat;
  border-radius: 20px;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);

  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;

  padding: 20px;
  font-size: 18px;

  z-index: 20;
  transition: 0.4s;
}

.letter.show {
  transform: translate(-50%, -50%) scale(1);
}

/* hoa chung */
.sakura {
  position: fixed;
  width: 10px;
  height: 10px;
  background: pink;
  border-radius: 50%;
  pointer-events: none;
  z-index: 5;
}

/* hoa rơi nhẹ */
.fall {
  animation: fall linear forwards;
}

@keyframes fall {
  from {
    transform: translateY(-20px) rotate(0);
    opacity: 1;
  }
  to {
    transform: translateY(110vh) rotate(360deg);
    opacity: 0;
  }
}

/* hoa bung từ mèo */
.burst {
  animation: burst 1s ease forwards;
}

@keyframes burst {
  from {
    transform: translate(0,0);
    opacity: 1;
  }
  to {
    transform: translate(var(--x), var(--y));
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="bg"></div>

<img src="cat.png" class="cat" id="cat">

<div class="letter" id="letter">
  Chúc eiu sinh nhật vv nhé:>.Năm nay a ko thể tặng quà cho iu đc rồi:<<. tuổi mới iu phải bt giữ gìn sức khỏe nhe, chúc iu mãi mãi xinh đẹp:>.I love you 😘
</div>
<audio id="music" src="nhac.mp3"></audio>
<script>
let count = 0;
const cat = document.getElementById("cat");
const letter = document.getElementById("letter");
const music = document.getElementById("music");

// 🌸 1. HOA RƠI FULL TIME (NHẸ)
setInterval(() => {
  let sakura = document.createElement("div");
  sakura.className = "sakura fall";

  sakura.style.left = Math.random() * window.innerWidth + "px";
  sakura.style.animationDuration = (6 + Math.random() * 5) + "s";

  document.body.appendChild(sakura);

  setTimeout(() => sakura.remove(), 7000);
}, 400);


// 🐱 2. CLICK MÈO
cat.addEventListener("click", () => {
  count++;
 

  // hiệu ứng nhấn
  cat.style.transform = "translate(-50%, -50%) scale(0.9)";
  setTimeout(() => {
    cat.style.transform = "translate(-50%, -50%) scale(1)";
  }, 100);

  let rect = cat.getBoundingClientRect(); 

    music.play(); // 🎵 phát nhạc




  // 🌸 hoa bung từ mèo
  for (let i = 0; i < 20; i++) {
    let sakura = document.createElement("div");
    sakura.className = "sakura burst";

    sakura.style.left = rect.left + rect.width/2 + "px";
    sakura.style.top = rect.top + rect.height/2 + "px";

    let x = (Math.random() - 0.5) * 300;
    let y = (Math.random() - 0.5) * 300;

    sakura.style.setProperty("--x", x + "px");
    sakura.style.setProperty("--y", y + "px");

    document.body.appendChild(sakura);

    setTimeout(() => sakura.remove(), 1000);
  }

  // 💌 hiện thư
  if (count >= 5) {
    letter.classList.add("show");
  }
});
</script>

</body>
</html>
