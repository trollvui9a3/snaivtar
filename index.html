<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>bấm zô đi eiu</title>

<style>
body {
  margin: 0;
  overflow: hidden;
}

/* nền */
.bg {
  position: fixed;
  inset: 0;
  background: #222;
}

/* mèo */
.cat {
  position: fixed;
  top: 60%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 200px;
  z-index: 10;
  cursor: pointer;
  transition: 0.15s;
}

/* thư */
.letter {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);

  width: 300px;
  height: 200px;
  background: white;

  display: flex;
  align-items: center;
  justify-content: center;

  opacity: 0;
  transition: 0.3s;
  z-index: 20;
}

.letter.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* hoa */
.sakura {
  position: fixed;
  width: 10px;
  height: 10px;
  background: pink;
  border-radius: 50%;
  pointer-events: none;
}

.burst {
  animation: burst 0.8s forwards;
}

@keyframes burst {
  to {
    transform: translate(var(--x), var(--y));
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="bg"></div>

<img src="cat.png" id="cat" class="cat">

<div id="letter" class="letter">
  🎉 Chúc mừng sinh nhật 🎉
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const cat = document.getElementById("cat");
  const letter = document.getElementById("letter");

  if (!cat) {
    console.log("❌ không tìm thấy mèo");
    return;
  }

  let count = 0;

  cat.addEventListener("click", () => {
    console.log("✅ click nhận");

    count++;

    // animation mèo
    cat.style.transform = "translate(-50%, -50%) scale(0.9)";
    setTimeout(() => {
      cat.style.transform = "translate(-50%, -50%) scale(1)";
    }, 100);

    // hoa bung
    let rect = cat.getBoundingClientRect();

    for (let i = 0; i < 10; i++) {
      let sakura = document.createElement("div");
      sakura.className = "sakura burst";

      sakura.style.left = rect.left + rect.width/2 + "px";
      sakura.style.top = rect.top + rect.height/2 + "px";

      sakura.style.setProperty("--x", (Math.random()-0.5)*200 + "px");
      sakura.style.setProperty("--y", (Math.random()-0.5)*200 + "px");

      document.body.appendChild(sakura);

      setTimeout(() => sakura.remove(), 800);
    }

    // hiện thư
    if (count >= 5) {
      letter.classList.add("show");
    }

  });

});
</script>

</body>
</html>
