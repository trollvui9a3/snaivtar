<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Happy Birthday 🎂</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
}

/* nền */
.bg {
  position: fixed;
  inset: 0;
  background: url("bg.jpg") center/cover no-repeat;
  filter: blur(6px) brightness(0.8);
  z-index: 0;
}

/* mèo */
.cat {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 150px;
  cursor: pointer;
  z-index: 10;
  transition: 0.2s;
}

/* 🆕 bong bóng */
.bubble {
  position: fixed;
  background: white;
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 14px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);

  opacity: 0;
  transform: translateY(-10px);
  transition: 0.3s;
  z-index: 15;
}

.bubble.show {
  opacity: 1;
  transform: translateY(0);
}

.bubble::after {
  content: "";
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  border: 10px solid transparent;
  border-top-color: white;
}

/* thư */
.letter {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  width: 320px;
  height: 220px;
  background: url("thu.png") center/cover no-repeat;
  border-radius: 20px;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);

  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;

  padding: 20px;
  font-size: 18px;

  z-index: 20;
  transition: 0.4s;
}

.letter.show {
  transform: translate(-50%, -50%) scale(1);
}

/* hoa */
.sakura {
  position: fixed;
  width: 10px;
  height: 10px;
  background: pink;
  border-radius: 50%;
  pointer-events: none;
  z-index: 5;
}

/* hoa rơi */
.fall {
  animation: fall linear forwards;
}

@keyframes fall {
  from {
    transform: translateY(-20px) rotate(0);
    opacity: 1;
  }
  to {
    transform: translateY(110vh) rotate(360deg);
    opacity: 0;
  }
}

/* hoa bung */
.burst {
  animation: burst 1s ease forwards;
}

@keyframes burst {
  from {
    transform: translate(0,0);
    opacity: 1;
  }
  to {
    transform: translate(var(--x), var(--y));
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="bg"></div>

<img src="cat.png" class="cat" id="cat">

<!-- 🆕 bong bóng -->
<div id="bubble" class="bubble">Bấm tui đi 😳</div>

<div class="letter" id="letter">
  Chúc mừng sinh nhật 🎉💖
</div>

<audio id="music" src="nhac.mp3"></audio>

<script>
let count = 0;
const cat = document.getElementById("cat");
const letter = document.getElementById("letter");
const music = document.getElementById("music");
const bubble = document.getElementById("bubble");

/* 📍 vị trí bong bóng */
function updateBubble() {
  let rect = cat.getBoundingClientRect();
  bubble.style.top = (rect.top - 60) + "px";
  bubble.style.left = (rect.left + rect.width/2 - 50) + "px";
}

/* hiện bubble */
window.onload = () => {
  updateBubble();
  bubble.classList.add("show");
};

/* hoa rơi */
setInterval(() => {
  let sakura = document.createElement("div");
  sakura.className = "sakura fall";

  sakura.style.left = Math.random() * window.innerWidth + "px";
  sakura.style.animationDuration = (6 + Math.random() * 5) + "s";

  document.body.appendChild(sakura);
  setTimeout(() => sakura.remove(), 7000);
}, 400);

/* click mèo */
cat.addEventListener("click", () => {
  count++;

  cat.style.transform = "translate(-50%, -50%) scale(0.9)";
  setTimeout(() => {
    cat.style.transform = "translate(-50%, -50%) scale(1)";
  }, 100);

  updateBubble();

  if (count === 1) bubble.innerText = "Ê nhẹ thôi 😠";
  if (count === 3) bubble.innerText = "Nữa đi 😏";
  if (count === 5) bubble.innerText = "Mở quà 💌";

  let rect = cat.getBoundingClientRect();

  bubble.style.top = (rect.top - 70) + "px";
  bubble.style.left = (rect.left + rect.width/2 - bubble.offsetWidth/2) + "px";
  for (let i = 0; i < 20; i++) {
    let sakura = document.createElement("div");
    sakura.className = "sakura burst";

    sakura.style.left = rect.left + rect.width/2 + "px";
    sakura.style.top = rect.top + rect.height/2 + "px";

    let x = (Math.random() - 0.5) * 300;
    let y = (Math.random() - 0.5) * 300;

    sakura.style.setProperty("--x", x + "px");
    sakura.style.setProperty("--y", y + "px");

    document.body.appendChild(sakura);
    setTimeout(() => sakura.remove(), 1000);
  }

  music.play();

  if (count >= 5) {
    letter.classList.add("show");
  }
  setInterval(updateBubble, 100);
  window.addEventListener("resize", updateBubble);
window.addEventListener("scroll", updateBubble);
});
</script>

</body>
</html>
